# Cloud Build pipeline: build -> push to Artifact Registry -> deploy to Cloud Run.
#
# Prerequisites (one-time):
#   1. Enable APIs:
#        gcloud services enable run.googleapis.com artifactregistry.googleapis.com \
#          cloudbuild.googleapis.com secretmanager.googleapis.com
#   2. Create the Artifact Registry repo (Docker):
#        gcloud artifacts repositories create rurumin \
#          --repository-format=docker --location=us-central1
#   3. Store the Gemini key in Secret Manager:
#        printf 'YOUR_KEY' | gcloud secrets create GEMINI_API_KEY --data-file=-
#   4. Grant the Cloud Build service account access:
#        - roles/run.admin, roles/iam.serviceAccountUser
#        - roles/secretmanager.secretAccessor  (to mount the secret at deploy)
#
# Run from the backend/ directory:
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: us-central1
  _REPO: rurumin
  _SERVICE: rurumin-api
  # Comma-separated CORS allow-list for production (Tauri webview schemes).
  _ALLOWED_ORIGINS: "tauri://localhost,https://tauri.localhost"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

steps:
  # 1. Build the Docker image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "."

  # 2. Push to Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

  # 3. Deploy to Cloud Run, mounting GEMINI_API_KEY from Secret Manager.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8080"
      - "--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest"
      - "--set-env-vars=ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}"
      # Desktop client calls the API directly; adjust auth to your needs.
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY
